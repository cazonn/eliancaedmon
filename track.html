{% extends "base.html" %}{% block content %}<section class="narrow"><small>PELACAKAN</small><h1>Status pesanan</h1><form method="post" class="panel"><label>Nomor pesanan<input name="order_id" required></label><label>Kode akses<input name="access_code" required></label><button class="btn primary">Periksa status</button>{% if error %}<p>{{error}}</p>{% endif %}</form>{% if order %}<div class="panel"><h2>{{order.id}}</h2><p>{{order.product_name}} · {{order.amount|idr}}</p><b>{{order.status}}</b></div>{% endif %}</section>{% endblock %}
